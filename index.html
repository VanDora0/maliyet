<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>14 Aralık Planlayıcı</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 font-sans pb-12">

  <div class="max-w-md mx-auto space-y-4">
    
    <!-- 14 Aralık Geri Sayım Kartı -->
    <div class="bg-gradient-to-r from-rose-600 to-pink-600 p-5 rounded-2xl shadow-lg">
      <div class="flex justify-between items-start">
        <div>
          <span class="bg-white/20 text-xs font-semibold px-2.5 py-1 rounded-full">
            📅 14 Aralık 2026 • Pazartesi
          </span>
          <h2 class="text-lg font-bold mt-2 text-rose-100">Doğum Gününe Kalan Süre</h2>
        </div>
        <span class="text-3xl">🎂</span>
      </div>
      
      <div class="grid grid-cols-3 gap-2 mt-4 text-center">
        <div class="bg-black/20 p-2.5 rounded-xl">
          <span id="days" class="text-2xl font-extrabold block">0</span>
          <span class="text-xs text-rose-200">Gün</span>
        </div>
        <div class="bg-black/20 p-2.5 rounded-xl">
          <span id="hours" class="text-2xl font-extrabold block">0</span>
          <span class="text-xs text-rose-200">Saat</span>
        </div>
        <div class="bg-black/20 p-2.5 rounded-xl">
          <span id="minutes" class="text-2xl font-extrabold block">0</span>
          <span class="text-xs text-rose-200">Dakika</span>
        </div>
      </div>
    </div>

    <!-- Maliyet Özeti -->
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl">
        <p class="text-slate-400 text-xs">Toplam Plan</p>
        <p id="totalAmount" class="text-lg font-bold text-white mt-1">0 ₺</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl">
        <p class="text-emerald-400 text-xs">Ödenen</p>
        <p id="paidAmount" class="text-lg font-bold text-emerald-400 mt-1">0 ₺</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl">
        <p class="text-amber-400 text-xs">Kalan</p>
        <p id="remainingAmount" class="text-lg font-bold text-amber-400 mt-1">0 ₺</p>
      </div>
    </div>

    <!-- Yeni Kalem Ekleme -->
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
      <input id="itemName" type="text" placeholder="Ne yapılacak? (Örn: Hediye, Pasta, Mekan)" 
        class="w-full bg-slate-800 text-white rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-rose-500">
      <div class="flex gap-2">
        <input id="itemCost" type="number" placeholder="Tutar (₺)" 
          class="w-full bg-slate-800 text-white rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-rose-500">
        <button onclick="addItem()" 
          class="bg-rose-600 active:bg-rose-700 px-6 rounded-xl font-semibold text-sm transition">
          Ekle
        </button>
      </div>
    </div>

    <!-- Yapılacaklar Listesi -->
    <div id="itemList" class="space-y-2"></div>

    <!-- Yedekleme Araçları -->
    <div class="pt-4 flex gap-2 justify-center">
      <button onclick="exportData()" class="text-xs bg-slate-900 border border-slate-800 text-slate-400 px-3 py-2 rounded-xl">
        📋 Verileri Yedekle (Kopyala)
      </button>
      <button onclick="importData()" class="text-xs bg-slate-900 border border-slate-800 text-slate-400 px-3 py-2 rounded-xl">
        📥 Yedek Yükle
      </button>
    </div>

  </div>

  <script>
    function updateCountdown() {
      const targetDate = new Date('2026-12-14T00:00:00').getTime();
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff <= 0) return;

      document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
      document.getElementById('hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      document.getElementById('minutes').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    let items = JSON.parse(localStorage.getItem('bday_14dec_items')) || [];

    function render() {
      const list = document.getElementById('itemList');
      list.innerHTML = '';
      
      let total = 0;
      let paid = 0;

      items.forEach((item, index) => {
        const cost = Number(item.cost);
        total += cost;
        if (item.done) paid += cost;

        list.innerHTML += `
          <div class="bg-slate-900 border ${item.done ? 'border-emerald-900/60 opacity-75' : 'border-slate-800'} p-3.5 rounded-xl flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer flex-1" onclick="toggleDone(${index})">
              <button class="w-6 h-6 rounded-lg border flex items-center justify-center ${item.done ? 'bg-emerald-500 border-emerald-500 text-black font-bold' : 'border-slate-600'}">
                ${item.done ? '✓' : ''}
              </button>
              <div>
                <p class="font-medium text-sm ${item.done ? 'line-through text-slate-400' : 'text-white'}">${item.name}</p>
                <p class="text-xs ${item.done ? 'text-emerald-400' : 'text-rose-400'} font-semibold">${cost.toLocaleString('tr-TR')} ₺</p>
              </div>
            </div>
            <button onclick="removeItem(${index})" class="text-slate-500 hover:text-red-400 text-xs px-2 py-1">
              Sil
            </button>
          </div>
        `;
      });

      document.getElementById('totalAmount').innerText = total.toLocaleString('tr-TR') + ' ₺';
      document.getElementById('paidAmount').innerText = paid.toLocaleString('tr-TR') + ' ₺';
      document.getElementById('remainingAmount').innerText = (total - paid).toLocaleString('tr-TR') + ' ₺';

      localStorage.setItem('bday_14dec_items', JSON.stringify(items));
    }

    function addItem() {
      const name = document.getElementById('itemName').value.trim();
      const cost = document.getElementById('itemCost').value;
      if (!name || !cost) return;

      items.push({ name, cost: Number(cost), done: false });
      document.getElementById('itemName').value = '';
      document.getElementById('itemCost').value = '';
      render();
    }

    function toggleDone(index) {
      items[index].done = !items[index].done;
      render();
    }

    function removeItem(index) {
      items.splice(index, 1);
      render();
    }

    function exportData() {
      navigator.clipboard.writeText(JSON.stringify(items));
      alert('Veriler kopyalandı! Notlar uygulamasına yapıştırıp saklayabilirsin.');
    }

    function importData() {
      const data = prompt('Kopyaladığın yedek kodunu buraya yapıştır:');
      if (!data) return;
      try {
        items = JSON.parse(data);
        render();
      } catch (e) {
        alert('Geçersiz yedek kodu!');
      }
    }

    render();
  </script>
</body>
</html>
